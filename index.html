<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080510">
<title>VYZO - Made by Mian Abdullah Gulzar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#070412;--card:rgba(24,18,40,0.92);--border:rgba(255,255,255,0.08);--muted:#8e86a3;--purple:#b45aff;--pink:#ff4ea8}
body{background:var(--bg);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding-bottom:96px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(1000px 700px at 15% 10%,rgba(120,40,255,0.24),transparent 60%),radial-gradient(800px 600px at 85% 70%,rgba(255,60,150,0.20),transparent 60%),#070412}
::-webkit-scrollbar{width:0;height:0}
button{border:0;background:none;cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit;outline:none}

/* ============ AUTH - BARA LOGO ============ */
#authScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 600px at 30% 20%,rgba(120,40,255,0.24),transparent),radial-gradient(700px 500px at 80% 80%,rgba(255,60,150,0.20),transparent),#070412;overflow:auto}
.auth{width:min(420px,100%);background:linear-gradient(180deg,rgba(28,20,48,0.96),rgba(16,12,28,0.98));border:1px solid rgba(255,255,255,0.08);border-radius:32px;padding:36px 24px;text-align:center;box-shadow:0 24px 90px rgba(0,0,0,0.6)}
.big-logo{width:130px;height:130px;margin:0 auto 20px;background:linear-gradient(135deg,#b45aff,#ff4ea8);border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#fff;box-shadow:0 16px 44px rgba(180,90,255,0.45)}
.auth h1{font-size:58px;font-weight:900;letter-spacing:-3px;background:linear-gradient(90deg,#b45aff,#ff4ea8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.sub{color:#a094b8;font-size:15px;margin:14px 0 28px}
.tabs{display:flex;background:rgba(255,255,255,0.05);border-radius:18px;padding:4px;margin-bottom:22px}
.tab{flex:1;padding:12px;border-radius:14px;font-weight:700;font-size:14.5px;color:#8e86a3;cursor:pointer}
.tab.active{background:#fff;color:#000}
.field{width:100%;padding:16px 18px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:18px;color:#fff;margin:8px 0;font-size:15px;text-align:left}
.field:focus{border-color:#b45aff;background:rgba(255,255,255,0.07)}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,#b45aff,#ff4ea8);color:#fff;border-radius:18px;font-weight:800;font-size:15.5px;cursor:pointer;margin-top:10px}
.made{margin-top:28px;font-size:12px;color:#7a748c}
.made b{color:#c49eff}
#msg{color:#ff8aa0;margin-top:14px;font-size:13px;min-height:18px}

/* ============ HEADER - PIC JESA ============ */
.app-hdr{position:sticky;top:0;z-index:20;padding:10px 14px;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(7,4,18,0.85),transparent);backdrop-filter:blur(6px)}
.hdr-pill{width:min(720px,100%);height:54px;background:rgba(20,16,34,0.92);border:1px solid rgba(255,255,255,0.09);border-radius:20px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(24px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.logo{font-size:36px;font-weight:900;letter-spacing:-2.5px;background:linear-gradient(90deg,#c27aff,#ff7ac8,#b45aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-right{display:flex;align-items:center;gap:14px}
.hdr-btn{color:#c8c0de;display:grid;place-items:center;width:32px;height:32px}
.hdr-btn svg{width:22px;height:22px;stroke-width:1.8}
.hdr-ava{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1);background:#1a1230}

/* ============ MAIN ============ */
main{max-width:720px;margin:0 auto;padding:0 14px}
.page{display:none}.page.active{display:block}

/* STORIES - PIC JESA ORB */
.stories{display:flex;gap:14px;overflow:auto;padding:14px 2px 18px;scrollbar-width:none}
.orb{min-width:66px;text-align:center;cursor:pointer}
.orb-ring{width:60px;height:60px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,#b45aff,#ff4ea8,#60a5fa);margin:0 auto 6px;position:relative;box-shadow:0 4px 16px rgba(180,90,255,0.22)}
.orb-ring img{width:100%;height:100%;border-radius:50%;border:3px solid #0f0a1e;display:block;object-fit:cover;background:#1a1230}
.orb-plus{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;background:linear-gradient(135deg,#b45aff,#ff4ea8);border-radius:50%;border:2px solid #0f0a1e;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900}
.orb span{font-size:11px;color:#c8c0de;font-weight:500}

/* COMPOSER - PIC JESA */
.composer{display:flex;align-items:center;gap:10px;background:rgba(22,18,38,0.92);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:10px 12px;margin-bottom:16px;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,0.25)}
.comp-grid{width:36px;height:36px;background:rgba(255,255,255,0.06);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-ava{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.08);background:#1a1230;flex-shrink:0}
.comp-input{flex:1;background:rgba(255,255,255,0.05);border:0;border-radius:18px;padding:10px 14px;color:#fff;font-size:13.5px}
.comp-input::placeholder{color:#7a758c}
.comp-ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-ic.purple{background:rgba(180,90,255,0.14)}
.comp-ic.pink{background:rgba(255,78,168,0.12)}

/* POSTS - PIC JESA HD */
.post{background:linear-gradient(180deg,rgba(28,22,48,0.92),rgba(22,18,38,0.92));border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:12px 12px 10px;margin-bottom:14px;backdrop-filter:blur(20px);box-shadow:0 12px 36px rgba(0,0,0,0.3);position:relative;overflow:hidden}
.post::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(180,90,255,0.28),transparent)}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.p-ava{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.08);background:#1a1230}
.p-name{font-weight:700;font-size:13.5px}.p-meta{font-size:11px;color:#8e86a3;margin-top:1px}
.p-text{font-size:13.5px;line-height:1.5;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.p-media{width:100%;border-radius:16px;background:#0d0a18;margin-bottom:10px;max-height:360px;object-fit:cover;display:block;border:1px solid rgba(255,255,255,0.06)}
.p-foot{display:flex;justify-content:space-between;align-items:center}
.p-foot-left{display:flex;gap:16px;align-items:center}
.act{display:flex;align-items:center;gap:6px;color:#c8c0de;font-size:12px;font-weight:600}
.act svg{width:18px;height:18px;stroke-width:1.7}
.act.liked{color:#ff5aa0}
.act.liked svg{fill:#ff5aa0;stroke:#ff5aa0}

/* COMMENTS */
.comment-box{display:none;margin-top:12px;border-top:1px solid rgba(255,255,255,0.07);padding-top:10px}
.cmt{padding:6px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,0.04)}
.cmt b{font-weight:700}
.cmt-input{width:100%;padding:10px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);border-radius:12px;color:#fff;margin-top:8px;font-size:12px}

/* PROFILE */
.cover{height:150px;border-radius:24px;background:linear-gradient(120deg,#5a2ad6,#b45aff,#ff4ea8,#3b82ff);margin-bottom:-50px;border:1px solid rgba(255,255,255,0.08)}
.profile-card{background:rgba(22,18,40,0.92);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:20px 18px;margin-top:10px}
.p-big-ava{width:84px;height:84px;border-radius:50%;border:4px solid #151020;object-fit:cover;background:#1a1230}
.stats{display:flex;gap:10px;margin:16px 0}
.stat{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center}
.stat strong{font-size:18px;display:block}
.stat span{font-size:10px;color:#8e86a3}

/* BOTTOM - PIC JESA */
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:30;width:min(380px,calc(100% - 24px));height:60px;background:rgba(18,14,32,0.94);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(28px);border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 16px 48px rgba(0,0,0,0.5)}
.nav{width:52px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#6e6a80;transition:all .2s}
.nav.active{color:#c27aff;background:rgba(255,255,255,0.06)}
.nav svg{width:24px;height:24px;stroke-width:1.8}
.create-btn{width:54px;height:46px;border-radius:16px;background:linear-gradient(135deg,#b45aff,#ff4ea8);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 20px rgba(180,90,255,0.35)}
.made-foot{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:#4a4560;z-index:29}

#camModal{display:none;position:fixed;inset:0;z-index:120;background:#000;padding:14px}
#camVideo{width:100%;height:70vh;object-fit:cover;border-radius:24px;background:#111}
#toast{display:none;position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:rgba(20,16,32,0.94);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(20px);color:#fff;padding:12px 20px;border-radius:16px;font-size:13px;font-weight:600;z-index:200}
.progress{height:4px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin-top:10px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#b45aff,#ff4ea8);transition:width .3s}
.empty{text-align:center;padding:40px 20px;color:#7a758c;font-size:13px;line-height:1.6}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
 <div class="auth">
  <div class="big-logo">VYZO</div>
  <h1>VYZO</h1>
  <p class="sub">Your world. Your voice. Your VYZO.</p>
  <div class="tabs">
    <button id="t1" class="tab active" onclick="loginTab()">Login</button>
    <button id="t2" class="tab" onclick="signupTab()">Sign Up</button>
  </div>
  <div id="loginBox">
    <input id="email" class="field" placeholder="Email address">
    <input id="pass" class="field" type="password" placeholder="Password">
    <button class="btn" onclick="login()">Continue to VYZO</button>
  </div>
  <div id="signupBox" style="display:none">
    <input id="sName" class="field" placeholder="Full name">
    <input id="sEmail" class="field" placeholder="Email address">
    <input id="sPass" class="field" type="password" placeholder="Password (6+ chars)">
    <select id="sCountry" class="field">
      <option value="Pakistan" selected>Pakistan</option>
      <option>United States</option><option>United Kingdom</option><option>India</option><option>Saudi Arabia</option><option>UAE</option><option>Canada</option><option>Turkey</option><option>Other</option>
    </select>
    <button class="btn" onclick="signup()">Create Account</button>
  </div>
  <div id="msg"></div>
  <div class="made">Made with ❤️ by <b>Mian Abdullah Gulzar</b></div>
 </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
 <div class="app-hdr">
  <div class="hdr-pill">
   <div class="logo">VYZO</div>
   <div class="hdr-right">
    <button class="hdr-btn" onclick="doSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="6"/><path d="M21 21l-3.5-3.5"/></svg></button>
    <button class="hdr-btn" onclick="openNotif()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10 21a2 2 0 0 0 4 0"/><circle cx="18" cy="7" r="2.5" fill="#ff4ea8" stroke="none"/></svg></button>
    <img id="hdrAva" class="hdr-ava" alt="">
   </div>
  </div>
 </div>

 <main>
  <section id="homePage" class="page active">
   <div class="stories" id="stories"></div>
   <div class="composer">
    <div class="comp-grid"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6a80" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></div>
    <img id="compAva" class="comp-ava" alt="">
    <input id="postInput" class="comp-input" placeholder="Share something..." onkeydown="if(event.key==='Enter'){addPost()}">
    <button class="comp-ic purple" onclick="document.getElementById('photoIn').click()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b45aff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="3.5"/></svg></button>
    <button class="comp-ic pink" onclick="document.getElementById('videoIn').click()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff4ea8" stroke-width="1.8"><path d="M12 3l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/><path d="M19 15l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg></button>
    <input id="photoIn" type="file" accept="image/*" hidden onchange="uploadMedia(this,'image')">
    <input id="videoIn" type="file" accept="video/*" hidden onchange="uploadMedia(this,'video')">
   </div>
   <div id="feed"></div>
  </section>

  <section id="searchPage" class="page">
   <h2 style="font-size:18px;font-weight:800;margin:10px 0 14px">Search VYZO 🔍</h2>
   <input id="searchInput" class="field" placeholder="Search users, posts..." oninput="doSearchLive(this.value)">
   <div id="searchRes" style="margin-top:14px"><div class="empty">Type to search</div></div>
  </section>

  <section id="notifPage" class="page">
   <h2 style="font-size:18px;font-weight:800;margin:10px 0 14px">Notifications 🔔</h2>
   <div id="notifList"></div>
  </section>

  <section id="newsPage" class="page">
   <h2 style="font-size:18px;font-weight:800;margin:10px 0 14px">World News • Live 🌍</h2>
   <select id="newsCountry" class="field" onchange="loadNews()"><option value="WORLD">🌍 Worldwide</option><option>Pakistan</option><option>United States</option><option>United Kingdom</option><option>India</option></select>
   <div id="newsList" style="margin-top:14px"><div class="empty">Select country for live headlines</div></div>
  </section>

  <section id="createPage" class="page">
   <h2 style="font-size:18px;font-weight:800
