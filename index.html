<script>
const $=id=>document.getElementById(id);
let users=JSON.parse(localStorage.getItem('vyzo_users')||'{}');
let current=JSON.parse(localStorage.getItem('vyzo_current')||'null');

function showToast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3000)}
function showError(msg){const el=$("authMessage");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),4000)}
window.showSignup=()=>{$("loginFields").style.display="none";$("signupFields").style.display="block"}
window.showLogin=()=>{$("signupFields").style.display="none";$("loginFields").style.display="block"}

window.signup=()=>{
 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim().toLowerCase();
 const pass=$("signupPassword").value;
 let country=$("signupCountry").value;

 // FIX: Auto default Pakistan if not selected - Error khatam
 if(!country || country===""){country="Pakistan";$("signupCountry").value="Pakistan"}

 if(!name){showError("Please enter Full Name HD");return}
 if(!email || !email.includes("@")){showError("Please enter valid Email HD");return}
 if(!pass || pass.length<6){showError("Complete all fields. Password needs 6 characters. HD");return}

 if(Object.values(users).some(u=>u.email===email)){showError("Email already exists - Login HD");return}

 const uid='u_'+Date.now();
 const user={uid,name,email,password:pass,country,id:"ce37d7b21f5a9a2a89313349aaa6786c1fe895c8",createdAt:Date.now()};
 users[uid]=user;current=user;
 localStorage.setItem('vyzo_users',JSON.stringify(users));
 localStorage.setItem('vyzo_current',JSON.stringify(user));
 $("authScreen").style.display="none";
 showToast("VYZO Account Created HD 4K - Welcome "+name+"!");
}

window.login=()=>{
 const email=$("email").value.trim().toLowerCase();
 const pass=$("password").value;
 if(!email||!pass){showError("Email & Password HD likhein");return}
 const user=Object.values(users).find(u=>u.email===email);
 if(!user){showError("Account nahi mila HD - Sign Up karo");return}
 if(user.password!==pass){showError("Password ghalat HD");return}
 current=user;localStorage.setItem('vyzo_current',JSON.stringify(user));
 $("authScreen").style.display="none";
 showToast("Login HD Success - VYZO");
}

function init(){
 if(current){$("authScreen").style.display="none"}
}
init();
</script>
