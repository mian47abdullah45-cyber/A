<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}
body{background:#fff;color:#111;height:100vh;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;height:62px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:1000;border-bottom:1px solid #eee}
.logo{font-weight:900;font-size:28px;display:flex;align-items:center;gap:8px}
.logoA{width:36px;height:32px;display:flex;gap:4px}.logoA span{display:block;width:46%;height:100%;transform:skewX(-18deg);border-radius:3px}.logoA span:nth-child(1){background:#111}.logoA span:nth-child(2){background:#1E4A8A}
.hdr{display:flex;gap:7px;align-items:center}
.btn{border:none;height:42px;border-radius:22px;font-size:12px;font-weight:700;cursor:pointer;padding:0 14px;line-height:1.1}
.btn-light{background:#f2f2f2;color:#111}.btn-dark{background:#111;color:#fff}.btn-blue{background:#1E4A8A;color:#fff}
.sbtn{width:42px;height:42px;border-radius:50%;background:#f2f2f2;border:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.feed{margin-top:62px;height:calc(100vh - 126px);overflow-y:scroll;scroll-snap-type:y mandatory;background:#fff}
.feed::-webkit-scrollbar{display:none}
.card{height:calc(100vh - 126px);scroll-snap-align:start;background:#fff;display:flex;flex-direction:column}
.media{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.right{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,0.96);padding:10px 8px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700}.act b{font-size:20px}
.info{padding:10px 14px;background:#fff}
.title{font-size:14.5px;font-weight:600;margin-bottom:3px}.sub{font-size:11.5px;color:#777}
.progress{height:3px;background:#eee;margin:0 14px;border-radius:2px}.bar{height:100%;background:#111;width:50%}
.hint{text-align:center;font-size:10.5px;color:#aaa;padding:6px 0}

/* BOTTOM - 100% REAL PICS JESA */
.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;align-items:center;z-index:1000;padding:0 4px}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:60px;opacity:0.6}
.nav.active{opacity:1}
.nav-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;position:relative}
.nav-icon.videos{background:#FF8C00;display:flex;align-items:center;justify-content:center}
.nav-icon.videos::after{content:'▶';color:#fff;font-size:14px;margin-left:2px}
.nav-icon.photos{background:#E8F5E9;border:2px solid #8BC34A;position:relative;overflow:hidden}
.nav-icon.photos::before{content:'';position:absolute;bottom:2px;left:2px;right:2px;height:10px;background:#8BC34A;clip-path:polygon(0 100%,20% 40%,40% 70%,60% 20%,100% 60%,100% 100%)}
.nav-icon.photos::after{content:'☀';position:absolute;top:1px;right:3px;font-size:10px}
.nav-icon.circle{background:transparent}
.nav-icon.circle span{width:14px;height:14px;background:#1976D2;border-radius:50%;position:absolute}
.nav-icon.circle span:nth-child(1){left:2px;top:8px}
.nav-icon.circle span:nth-child(2){right:2px;top:8px}
.nav-icon.circle span::after{content:'';position:absolute;bottom:-10px;left:-2px;right:-2px;height:10px;background:#1976D2;border-radius:6px 6px 0 0}
.nav-icon.bazaar{position:relative}
.nav-icon.bazaar .bag{width:14px;height:16px;border-radius:2px;position:absolute;bottom:2px}
.nav-icon.bazaar .bag:nth-child(1){background:#4CAF50;left:2px;transform:rotate(-8deg)}
.nav-icon.bazaar .bag:nth-child(2){background:#E91E63;right:2px;transform:rotate(8deg)}
.nav-icon.profile{width:28px;height:28px;background:#1976D2;border-radius:50%;position:relative;overflow:hidden}
.nav-icon.profile::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:10px;height:10px;background:#fff;border-radius:50%}
.nav-icon.profile::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:20px;height:12px;background:#fff;border-radius:10px 10px 0 0}
.nav-label{font-size:11px;font-weight:600;color:#333;margin-top:1px}

/* MODALS NO ERROR */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:20px}
.input{width:100%;height:44px;border:1px solid #e5e5e5;background:#f9f9f9;border-radius:12px;padding:0 14px;margin-top:10px;outline:none}.input:focus{border-color:#111;background:#fff}
.btn-full{width:100%;height:44px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:700;margin-top:12px;cursor:pointer}
.err{color:#ff3040;font-size:12px;margin-top:6px;display:none}.err.show{display:block}.ok{color:#0a8a40;font-size:12px;margin-top:6px;display:none}.ok.show{display:block}
.drop{border:2px dashed #ddd;border-radius:14px;padding:16px;text-align:center;margin-top:10px;background:#fafafa;cursor:pointer}.fileInfo{font-size:11px;margin-top:6px;background:#fff;border:1px solid #eee;padding:6px 8px;border-radius:8px;display:none}.fileInfo.show{display:block}
</style>
</head>

<div class="logo"><div class="logoA"><span></span><span></span></div> NEX</div>

</div>
</div>
